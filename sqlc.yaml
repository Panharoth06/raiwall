version: "2"
sql:
  - schema: "internal/adapters/outbound/storage/sqlite/schema.sql"
    queries: "internal/adapters/outbound/storage/sqlite/query.sql"
    engine: "sqlite"
    gen:
      go:
        package: "sqlite"
        out: "internal/adapters/outbound/storage/sqlite"
        sql_package: "database/sql"
