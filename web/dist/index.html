<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/.raiwall/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/.raiwall/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap">
    <title>Raiwall WAF - Command Center Dashboard</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('raiwall_theme');
          var isDark = true;
          if (stored === 'light') {
            isDark = false;
          } else if (stored === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/.raiwall/assets/index-DDC9SG0G.js"></script>
    <link rel="stylesheet" crossorigin href="/.raiwall/assets/index-CrzmZDkF.css">
  </head>
  <body class="bg-background text-foreground overflow-hidden font-sans">
    <div id="app"></div>
  </body>
</html>
