apiVersion: v1
kind: Service
metadata:
  name: {{ include "raiwall.fullname" . }}
  labels:
    {{- include "raiwall.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "raiwall.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.config.server.http.enabled }}
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- end }}
    {{- if .Values.config.server.https.enabled }}
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
    {{- if .Values.config.server.https.http3 }}
    - name: https-udp
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: UDP
    {{- end }}
    {{- end }}
    {{- if and .Values.config.sidecar .Values.config.sidecar.enabled }}
    - name: grpc
      port: {{ include "raiwall.containerPort" .Values.config.sidecar.listen }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
