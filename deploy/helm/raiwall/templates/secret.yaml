{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "raiwall.fullname" .) }}
  labels:
    {{- include "raiwall.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.database.existingSecret }}
  RAIWALL_DATABASE_URL: {{ include "raiwall.databaseURL" . | b64enc | quote }}
  {{- end }}
  RAIWALL_HMAC_SECRET: {{ include "raiwall.secretValue" (dict "ctx" . "env" "RAIWALL_HMAC_SECRET" "value" .Values.secrets.hmacSecret) | b64enc | quote }}
  RAIWALL_POW_SECRET: {{ include "raiwall.secretValue" (dict "ctx" . "env" "RAIWALL_POW_SECRET" "value" .Values.secrets.powSecret) | b64enc | quote }}
  {{- /* An omitted admin password lets the application generate one and log it once. */}}
  {{- with .Values.secrets.adminPassword }}
  RAIWALL_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.sessionSecret }}
  RAIWALL_SESSION_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.alertWebhook }}
  RAIWALL_ALERT_WEBHOOK: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
