# ==============================================================================
# Production Compose: public HTTPS terminated by Raiwall.
# ==============================================================================
# Prerequisites:
#   cp .env.example .env
#   # set POSTGRES_PASSWORD, RAIWALL_HMAC_SECRET, RAIWALL_POW_SECRET,
#   #     RAIWALL_PUBLIC_URL, RAIWALL_ACME_EMAIL (see docs/deployment.md)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ports 80/443 must reach this host for ACME and client traffic. The container
# listens on 8080/8443 internally because it runs as a non-root user.
# ==============================================================================
name: raiwall

services:
  postgres:
    image: postgres:18-alpine
    container_name: raiwall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raiwall}
      POSTGRES_USER: ${POSTGRES_USER:-raiwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raiwall} -d ${POSTGRES_DB:-raiwall}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - raiwall-net

  raiwall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raiwall-waf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RAIWALL_HTTP_PORT:-80}:8080"
      - "${RAIWALL_HTTPS_PORT:-443}:8443"
      - "${RAIWALL_HTTPS_PORT:-443}:8443/udp" # HTTP/3
    environment:
      RAIWALL_DATABASE_URL: ${RAIWALL_DATABASE_URL:-postgres://${POSTGRES_USER:-raiwall}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-raiwall}?sslmode=disable}
      RAIWALL_PUBLIC_URL: ${RAIWALL_PUBLIC_URL:?set RAIWALL_PUBLIC_URL, e.g. https://raiwall.example.com}
      RAIWALL_ACME_EMAIL: ${RAIWALL_ACME_EMAIL:?set RAIWALL_ACME_EMAIL}
      RAIWALL_ADMIN_USERNAME: ${RAIWALL_ADMIN_USERNAME:-admin}
      RAIWALL_ADMIN_PASSWORD: ${RAIWALL_ADMIN_PASSWORD:-}
      RAIWALL_HMAC_SECRET: ${RAIWALL_HMAC_SECRET:?set RAIWALL_HMAC_SECRET in .env}
      RAIWALL_POW_SECRET: ${RAIWALL_POW_SECRET:?set RAIWALL_POW_SECRET in .env}
      RAIWALL_LOG_LEVEL: ${RAIWALL_LOG_LEVEL:-info}
      RAIWALL_GEOIP_LICENSE_KEY: ${RAIWALL_GEOIP_LICENSE_KEY:-}
    volumes:
      - raiwall_data:/var/lib/raiwall
      - ./config/raiwall.production.yaml:/etc/raiwall/raiwall.yaml:ro
      - ./examples/feeds:/etc/raiwall/feeds:ro
      - ${RAIWALL_GEOIP_DIR:-./data/geoip}:/usr/share/GeoIP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/.raiwall/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - raiwall-net

networks:
  raiwall-net:
    driver: bridge

volumes:
  raiwall_data:
    driver: local
